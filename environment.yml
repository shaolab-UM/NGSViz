# Cross-platform direct dependency specification.
# Exact package builds are recorded in conda-lock/<platform>.lock.
name: ngsViz
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - cxx-compiler
  - make
  - openjdk>=17,<26
  - r-base>=4.4,<4.5
  - pandoc
  - r-aplot
  - r-bs4dash
  - r-biocmanager
  - r-circlize
  - r-colorspace
  - r-corrplot
  - r-cowplot
  - r-data.table
  - r-dplyr
  - r-dt
  - r-factominer
  - r-fresh
  - r-future
  - r-ggh4x
  - r-ggplot2
  - r-ggrepel
  - r-ggsci
  - r-here
  - r-jsonlite
  - r-getoptlong
  - r-leaflet
  - r-markdown
  - r-locfit
  - r-matrixstats
  - r-pak
  - r-plotly
  - r-processx
  - r-promises
  - r-purrr
  - r-rcolorbrewer
  - r-rcpp
  - r-rcpproll
  - r-readr
  - r-reshape2
  - r-rsqlite
  - r-scales
  - r-shiny
  - r-shinyfiles
  - r-tidyr
  - r-tidyverse
  - r-zoo
  - bioconductor-biomart
  - bioconductor-biocversion
  - bioconductor-complexheatmap
  - bioconductor-genomicranges
  - bioconductor-iranges
  - bioconductor-rtracklayer
